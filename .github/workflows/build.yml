---
name: Build

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test building image.
        run: docker build -t test-image .

      - name: Validate the config and rules.
        run: |
          docker run --rm --entrypoint promtool test-image \
            check config /etc/prometheus/prometheus.yml

      - name: Run the image.
        run: docker run -d --name prometheus -p 9090:9090 test-image

      - name: Verify Prometheus is healthy.
        run: |
          for i in $(seq 1 12); do
            if curl -fsS http://localhost:9090/-/healthy >/dev/null; then
              echo "Prometheus is up"; exit 0
            fi
            sleep 5
          done
          docker logs prometheus
          exit 1

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image.
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ github.repository }}:latest
