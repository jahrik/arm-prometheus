global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 30s
  external_labels:
    monitor: 'arm_swarm'

rule_files:
  - "rules/swarm_node.rules.yml"
  - "rules/swarm_task.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'grafana'
    dns_sd_configs:
      - names:
          - 'tasks.grafana'
        type: 'A'
        port: 3000

  - job_name: 'traefik'
    dns_sd_configs:
      - names:
          - 'tasks.traefik'
        type: 'A'
        port: 8080

  - job_name: 'node-exporter'
    dns_sd_configs:
      - names:
          - 'tasks.node-exporter'
        type: 'A'
        port: 9100

  - job_name: 'cadvisor'
    dns_sd_configs:
      - names:
          - 'tasks.cadvisor'
        type: 'A'
        port: 8080
